name: Launch Gate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: read

jobs:
  supported-runtime:
    name: Launch gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Setup Elixir / OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.18.4
          otp-version: "28.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare Mix
        run: |
          mix local.hex --force
          mix local.rebar --force
          cd kernel
          mix deps.get

      - name: Typecheck
        run: bun run typecheck

      - name: Protocol checks
        run: bun run check:protocol

      - name: Compile kernel
        run: |
          cd kernel
          mix compile

      - name: Manifest checks
        run: bun run check:manifest

      - name: Kernel invariant tests
        run: bun run test:kernel

      - name: Test supported runtime path
        run: bun run test

      - name: Smoke install
        run: bun run smoke:install

      - name: Smoke release install
        run: bun run build:release && bun run smoke:release-install

  preview-node-worker:
    name: Launch gate preview Node worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Elixir / OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.18.4
          otp-version: "28.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare Mix
        run: |
          mix local.hex --force
          mix local.rebar --force
          cd kernel
          mix deps.get

      - name: Compile kernel
        run: |
          cd kernel
          mix compile

      - name: Run preview Node worker lane
        run: bun run test:preview-node

  soak:
    name: Launch gate soak
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Setup Elixir / OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.18.4
          otp-version: "28.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare Mix
        run: |
          mix local.hex --force
          mix local.rebar --force
          cd kernel
          mix deps.get

      - name: Compile kernel
        run: |
          cd kernel
          mix compile

      - name: Run soak lane
        run: bun run test:soak
