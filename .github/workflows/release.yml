name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  id-token: write

jobs:
  build-release:
    name: Build release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin-arm64
          - os: ubuntu-latest
            platform: linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "28.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare Mix
        run: bash scripts/prepare-mix.sh

      - name: Verify repo versions match tag
        if: github.event_name == 'push'
        run: bun scripts/check-release-versions.ts

      - name: Verify manifest and protocol contracts
        run: |
          bun run typecheck
          bun run check:manifest
          bun run check:protocol

      - name: Compile kernel
        run: |
          cd kernel
          mix compile

      - name: Run kernel tests
        run: bun run test:kernel

      - name: Run runtime tests
        run: bun run test

      - name: Build local release artifacts
        env:
          VILANO_RELEASE_PLATFORM: ${{ matrix.platform }}
        run: bun run build:release

      - name: Run release-install smoke
        run: bun scripts/smoke-release-install.ts

      - name: Verify tag release notes file
        if: github.event_name == 'push'
        run: test -f docs/release-notes/${{ github.ref_name }}.md

      - name: Build publish-ready release artifacts
        if: github.event_name == 'push'
        env:
          VILANO_RELEASE_PLATFORM: ${{ matrix.platform }}
          VILANO_RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
          VILANO_RELEASE_NOTES_URL: https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/release-notes/${{ github.ref_name }}.md
        run: bun run build:release

      - name: Build publish-ready release artifacts (dry run)
        if: github.event_name != 'push'
        env:
          VILANO_RELEASE_PLATFORM: ${{ matrix.platform }}
          VILANO_RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/dry-run
        run: bun run build:release

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/release
          if-no-files-found: error

  assemble-release:
    name: Assemble release metadata
    runs-on: ubuntu-latest
    needs: build-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Node
        if: github.event_name == 'push'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/release-input

      - name: Merge release metadata
        env:
          VILANO_RELEASE_INPUT_DIR: ${{ github.workspace }}/dist/release-input
          VILANO_RELEASE_OUTPUT_DIR: ${{ github.workspace }}/dist/release
        run: bun run merge:release

      - name: Verify assembled release bundle
        run: bun run verify:release

      - name: Verify tagged release metadata
        if: github.event_name == 'push'
        run: |
          bun scripts/verify-release-publication.ts \
            --release-manifest dist/release/release.json \
            --installer dist/release/install.sh \
            --channel stable \
            --expected-version "${GITHUB_REF_NAME#v}" \
            --platform darwin-arm64 \
            --platform linux-x64 \
            --artifact-url-prefix "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/" \
            --expected-notes-url "https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/release-notes/${{ github.ref_name }}.md"

      - name: Upload assembled release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-assembled
          path: dist/release
          if-no-files-found: error

      - name: Build SDK package
        if: github.event_name == 'push'
        run: bun run build:sdk

      - name: Check npm package availability
        if: github.event_name == 'push'
        id: npm_runtime
        run: |
          if npm view "@vilano/runtime@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish @vilano/runtime to npm
        if: github.event_name == 'push' && steps.npm_runtime.outputs.already_published != 'true'
        working-directory: sdk/typescript
        run: npm publish --provenance

      - name: Publish GitHub prerelease
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          body_path: docs/release-notes/${{ github.ref_name }}.md
          files: |
            dist/release/*.tar.gz
            dist/release/SHA256SUMS
            dist/release/release.json
            dist/release/install.sh

      - name: Sync installer worker assets
        run: bun run sync:installer-worker

      - name: Deploy installer worker
        if: github.event_name == 'push'
        working-directory: deploy/cloudflare/runtime-installer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm exec --yes wrangler@4.74.0 -- deploy --config wrangler.jsonc

      - name: Verify live runtime front door
        if: github.event_name == 'push'
        run: |
          for attempt in 1 2 3 4 5 6; do
            if bun scripts/verify-release-publication.ts \
              --release-manifest "https://runtime.vilano.ai/release.json" \
              --installer "https://runtime.vilano.ai/install.sh" \
              --channel stable \
              --expected-version "${GITHUB_REF_NAME#v}" \
              --platform darwin-arm64 \
              --platform linux-x64 \
              --artifact-url-prefix "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/" \
              --expected-notes-url "https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/release-notes/${{ github.ref_name }}.md"; then
              exit 0
            fi

            if [ "$attempt" -lt 6 ]; then
              sleep 10
            fi
          done

          exit 1

      - name: Promote GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_id="$(gh api repos/${{ github.repository }}/releases/tags/${{ github.ref_name }} --jq .id)"
          gh api \
            --method PATCH \
            "repos/${{ github.repository }}/releases/${release_id}" \
            -f prerelease=false >/dev/null

      - name: Delete GitHub prerelease on failure
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ github.ref_name }}" --yes || true
