name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-release:
    name: Build release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin-arm64
          - os: ubuntu-latest
            platform: linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "28.3.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify manifest and protocol contracts
        run: |
          bun run typecheck
          bun run check:manifest
          bun run check:protocol

      - name: Run kernel tests
        run: bun run test:kernel

      - name: Run runtime tests
        run: bun run test

      - name: Run release-install smoke
        run: bun scripts/smoke-release-install.ts

      - name: Build release artifacts
        env:
          VILANO_RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name || 'dry-run' }}
        run: bun run build:release

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/release
          if-no-files-found: error

  assemble-release:
    name: Assemble release metadata
    runs-on: ubuntu-latest
    needs: build-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/release-input

      - name: Merge release metadata
        env:
          VILANO_RELEASE_INPUT_DIR: ${{ github.workspace }}/dist/release-input
          VILANO_RELEASE_OUTPUT_DIR: ${{ github.workspace }}/dist/release
        run: bun run merge:release

      - name: Upload assembled release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-assembled
          path: dist/release
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/*.tar.gz
            dist/release/SHA256SUMS
            dist/release/release.json
            dist/release/install.sh

      - name: Sync installer worker assets
        run: bun run sync:installer-worker

      - name: Deploy installer worker
        if: github.event_name == 'push'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: deploy/cloudflare/runtime-installer
          command: deploy --config wrangler.jsonc
