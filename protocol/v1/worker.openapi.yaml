openapi: 3.1.0
info:
  title: Vilano Worker Protocol
  version: 1.0.0
  description: >
    Kernel-to-worker control-plane contract for activation leasing and durable
    operation resolution.
servers:
  - url: http://127.0.0.1:4141
components:
  securitySchemes:
    daemonToken:
      type: apiKey
      in: header
      name: X-Vilano-Token
  schemas:
    JsonValue:
      description: Arbitrary JSON payload.
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    StatusResponse:
      type: object
      required: [ok, runtimeVersion, protocolVersion, schemaVersion]
      properties:
        ok:
          const: true
        runtimeVersion:
          type: string
        protocolVersion:
          type: integer
        schemaVersion:
          type: integer
    WaitRef:
      type: object
      required: [key, kind, name]
      properties:
        key:
          type: string
        kind:
          type: string
        name:
          type: string
    WorkflowActivation:
      type: object
      required: [kind, leaseId, leaseToken, leaseExpiresAt, run, project, definition]
      properties:
        kind:
          const: workflow
        leaseId:
          type: string
        leaseToken:
          type: string
        leaseExpiresAt:
          type: string
          format: date-time
        run:
          type: object
          required: [id, input]
          properties:
            id:
              type: string
            input: {}
        project:
          type: object
          required: [name, path]
          properties:
            name:
              type: string
            path:
              type: string
        definition:
          $ref: '#/components/schemas/DefinitionRef'
    ServiceTurnActivation:
      type: object
      required: [kind, leaseId, leaseToken, leaseExpiresAt, run, project, definition, service, envelope]
      properties:
        kind:
          const: service_turn
        leaseId:
          type: string
        leaseToken:
          type: string
        leaseExpiresAt:
          type: string
          format: date-time
        run:
          type: object
          required: [id]
          properties:
            id:
              type: string
        project:
          type: object
          required: [name, path]
          properties:
            name:
              type: string
            path:
              type: string
        definition:
          $ref: '#/components/schemas/DefinitionRef'
        service:
          type: object
          required: [key, keyInput, state]
          properties:
            key:
              type: string
            keyInput: {}
            state: {}
        envelope:
          type: object
          required: [id, kind, name, attempt, payload]
          properties:
            id:
              type: string
            kind:
              enum: [send, ask, signal]
            name:
              type: string
            attempt:
              type: integer
            payload: {}
            correlationId:
              type: [string, "null"]
            senderRunId:
              type: [string, "null"]
    DefinitionRef:
      type: object
      required: [kind, name, exportName, file, runtimeKind, sourceLanguage]
      properties:
        kind:
          enum: [workflow, service]
        name:
          type: string
        exportName:
          type: string
        file:
          type: string
        runtimeKind:
          type: string
          enum: [javascript]
        sourceLanguage:
          type: string
          enum: [typescript, javascript]
    ActivationLeaseResponse:
      type: object
      required: [ok, activation]
      properties:
        ok:
          const: true
        activation:
          oneOf:
            - $ref: '#/components/schemas/WorkflowActivation'
            - $ref: '#/components/schemas/ServiceTurnActivation'
            - type: 'null'
    HeartbeatResponse:
      type: object
      required: [ok, lease]
      properties:
        ok:
          const: true
        lease:
          type: object
          required: [leaseExpiresAt]
          properties:
            leaseExpiresAt:
              type: string
              format: date-time
    LeaseStatusActive:
      type: object
      required: [active, runId, status, definitionKind, leaseExpiresAt]
      properties:
        active:
          const: true
        runId:
          type: string
        status:
          type: string
        definitionKind:
          type: string
        leaseExpiresAt:
          type: [string, 'null']
          format: date-time
    LeaseStatusInactive:
      type: object
      required: [active]
      properties:
        active:
          const: false
    LeaseStatusResponse:
      type: object
      required: [ok, lease]
      properties:
        ok:
          const: true
        lease:
          oneOf:
            - $ref: '#/components/schemas/LeaseStatusActive'
            - $ref: '#/components/schemas/LeaseStatusInactive'
    StepStatePending:
      type: object
      required: [status, attempt]
      properties:
        status:
          const: pending
        attempt:
          type: integer
    StepStateCompleted:
      type: object
      required: [status, output]
      properties:
        status:
          const: completed
        output: {}
    StepStateFailed:
      type: object
      required: [status, error]
      properties:
        status:
          const: failed
        error: {}
    StepResolveResponse:
      type: object
      required: [ok, step]
      properties:
        ok:
          const: true
        step:
          oneOf:
            - $ref: '#/components/schemas/StepStatePending'
            - $ref: '#/components/schemas/StepStateCompleted'
            - $ref: '#/components/schemas/StepStateFailed'
    RetryWaitingState:
      type: object
      required: [status, wait]
      properties:
        status:
          const: retry_waiting
        wait:
          $ref: '#/components/schemas/WaitRef'
    StepFailResponse:
      type: object
      required: [ok, step]
      properties:
        ok:
          const: true
        step:
          oneOf:
            - $ref: '#/components/schemas/StepStateFailed'
            - $ref: '#/components/schemas/RetryWaitingState'
    ExecExecute:
      type: object
      required: [status, attempt]
      properties:
        status:
          const: execute
        attempt:
          type: integer
    ExecCompleted:
      type: object
      required: [status, output]
      properties:
        status:
          const: completed
        output: {}
    ExecFailed:
      type: object
      required: [status, error]
      properties:
        status:
          const: failed
        error: {}
    ExecResolveResponse:
      type: object
      required: [ok, exec]
      properties:
        ok:
          const: true
        exec:
          oneOf:
            - $ref: '#/components/schemas/ExecExecute'
            - $ref: '#/components/schemas/ExecCompleted'
            - $ref: '#/components/schemas/ExecFailed'
    ExecFailResponse:
      type: object
      required: [ok, exec]
      properties:
        ok:
          const: true
        exec:
          oneOf:
            - $ref: '#/components/schemas/ExecFailed'
            - $ref: '#/components/schemas/RetryWaitingState'
    WaitCompleted:
      type: object
      required: [status]
      properties:
        status:
          const: completed
        output: {}
    WaitSuspended:
      type: object
      required: [status, wait]
      properties:
        status:
          const: suspended
        wait:
          $ref: '#/components/schemas/WaitRef'
    WaitResolveResponse:
      type: object
      required: [ok, wait]
      properties:
        ok:
          const: true
        wait:
          oneOf:
            - $ref: '#/components/schemas/WaitCompleted'
            - $ref: '#/components/schemas/WaitSuspended'
    ChildCompleted:
      type: object
      required: [status, output]
      properties:
        status:
          const: completed
        output: {}
    ChildFailed:
      type: object
      required: [status, error]
      properties:
        status:
          const: failed
        error: {}
    ChildResultResponse:
      type: object
      required: [ok, child]
      properties:
        ok:
          const: true
        child:
          oneOf:
            - $ref: '#/components/schemas/ChildCompleted'
            - $ref: '#/components/schemas/ChildFailed'
            - $ref: '#/components/schemas/WaitSuspended'
    SpawnResolveResponse:
      type: object
      required: [ok, spawn]
      properties:
        ok:
          const: true
        spawn:
          type: object
          required: [status, childRun]
          properties:
            status:
              type: string
              enum: [created, existing]
            childRun:
              type: object
              required: [id, status]
              properties:
                id:
                  type: string
                status:
                  type: string
                output: {}
                error: {}
    RunStatusResponse:
      type: object
      required: [ok, run]
      properties:
        ok:
          const: true
        run:
          type: object
          required: [status]
          properties:
            status:
              type: string
    RelationshipRef:
      type: object
      required: [id, targetRunId, kind, propagate, status]
      properties:
        id:
          type: string
        targetRunId:
          type: string
        kind:
          enum: [monitor, link]
        propagate:
          enum: [abnormal, all]
        status:
          enum: [active, triggered]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RelationshipResolveResponse:
      type: object
      required: [ok, relationship]
      properties:
        ok:
          const: true
        relationship:
          $ref: '#/components/schemas/RelationshipRef'
    ServiceRunResponse:
      type: object
      required: [ok, run]
      properties:
        ok:
          const: true
        run:
          type: object
          required: [id, status]
          properties:
            id:
              type: string
            status:
              type: string
    ServiceCallCompleted:
      type: object
      required: [status]
      properties:
        status:
          const: completed
        output: {}
    ServiceCallFailed:
      type: object
      required: [status, error]
      properties:
        status:
          const: failed
        error: {}
    ServiceCallResolveResponse:
      type: object
      required: [ok, result]
      properties:
        ok:
          const: true
        result:
          oneOf:
            - $ref: '#/components/schemas/ServiceCallCompleted'
            - $ref: '#/components/schemas/ServiceCallFailed'
            - $ref: '#/components/schemas/WaitSuspended'
    ServiceTurnFailResponse:
      type: object
      required: [ok, run]
      properties:
        ok:
          const: true
        run: {}
        status:
          type: string
          enum: [retry_waiting]
        wait:
          $ref: '#/components/schemas/WaitRef'
    ServiceTurnCompleteResponse:
      type: object
      required: [ok, run]
      properties:
        ok:
          const: true
        run: {}
    RunMutationResponse:
      type: object
      required: [ok, run]
      properties:
        ok:
          const: true
        run: {}
    SignalResponse:
      type: object
      required: [ok, signal]
      properties:
        ok:
          const: true
        signal: {}
security:
  - daemonToken: []
paths:
  /v1/status:
    get:
      summary: Read kernel compatibility metadata.
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
  /v1/activations/lease:
    post:
      summary: Lease the next workflow or service-turn activation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workerId]
              properties:
                workerId:
                  type: string
      responses:
        '200':
          description: Activation lease result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationLeaseResponse'
  /v1/leases/{leaseId}/heartbeat:
    post:
      summary: Renew an activation lease.
      parameters:
        - in: path
          name: leaseId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workerId]
              properties:
                workerId:
                  type: string
      responses:
        '200':
          description: Lease heartbeat accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeartbeatResponse'
  /v1/leases/{leaseId}/status:
    get:
      summary: Inspect whether a lease is still active.
      parameters:
        - in: path
          name: leaseId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lease status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaseStatusResponse'
  /v1/leases/{leaseId}/runs/{id}/status:
    get:
      summary: Inspect a child run or related service run from the active lease context.
      parameters:
        - in: path
          name: leaseId
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Related run status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunStatusResponse'
  /v1/leases/{leaseId}/runs/{id}/monitor:
    post:
      summary: Register a durable monitor on a related run.
      parameters:
        - in: path
          name: leaseId
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key:
                  type: string
      responses:
        '200':
          description: Relationship state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipResolveResponse'
  /v1/leases/{leaseId}/runs/{id}/link:
    post:
      summary: Register a durable link on a related run.
      parameters:
        - in: path
          name: leaseId
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key:
                  type: string
                propagate:
                  type: string
                  enum: [abnormal, all]
      responses:
        '200':
          description: Relationship state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipResolveResponse'
  /v1/leases/{leaseId}/trap-exits:
    post:
      summary: Enable or disable trapping linked exits for the active run.
      parameters:
        - in: path
          name: leaseId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: Run state updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunMutationResponse'
  /v1/leases/{leaseId}/runs/{id}/signals:
    post:
      summary: Send a signal to a child run from the active lease context.
      parameters:
        - in: path
          name: leaseId
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                payload: {}
      responses:
        '200':
          description: Child signal accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalResponse'
  /v1/leases/{leaseId}/complete:
    post:
      summary: Complete a workflow activation.
      parameters:
        - in: path
          name: leaseId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result: {}
      responses:
        '200':
          description: Workflow completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunMutationResponse'
  /v1/leases/{leaseId}/fail:
    post:
      summary: Fail a workflow activation.
      parameters:
        - in: path
          name: leaseId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [error]
              properties:
                error: {}
      responses:
        '200':
          description: Workflow failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunMutationResponse'
  /v1/leases/{leaseId}/steps/resolve:
    post:
      summary: Resolve or create a durable step boundary.
      parameters:
        - in: path
          name: leaseId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, key]
              properties:
                name:
                  type: string
                key:
                  type: string
                timeoutMs:
                  type: [integer, 'null']
                maxAttempts:
                  type: [integer, 'null']
                backoffKind:
                  type: [string, 'null']
                backoffMs:
                  type: [integer, 'null']
                backoffStepMs:
                  type: [integer, 'null']
                backoffFactor:
                  type: [number, 'null']
                maxBackoffMs:
                  type: [integer, 'null']
                backoffJitterKind:
                  type: [string, 'null']
                backoffJitterRatio:
                  type: [number, 'null']
                retryOn:
                  type: [array, 'null']
                  items:
                    type: string
      responses:
        '200':
          description: Step state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepResolveResponse'
  /v1/leases/{leaseId}/steps/complete:
    post:
      summary: Complete a durable step.
      parameters:
        - in: path
          name: leaseId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, key, output]
              properties:
                name:
                  type: string
                key:
                  type: string
                output: {}
      responses:
        '200':
          description: Step completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepResolveResponse'
  /v1/leases/{leaseId}/steps/fail:
    post:
      summary: Fail a durable step.
      parameters:
        - in: path
          name: leaseId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, key, error]
              properties:
                name:
                  type: string
                key:
                  type: string
                error: {}
      responses:
        '200':
          description: Step failed or entered retry wait
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepFailResponse'
  /v1/leases/{leaseId}/execs/resolve:
    post:
      summary: Resolve or create a durable exec boundary.
      parameters:
        - in: path
          name: leaseId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, key, cmd, args]
              properties:
                name:
                  type: string
                key:
                  type: string
                cmd:
                  type: string
                args:
                  type: array
                  items:
                    type: string
                cwd:
                  type: [string, 'null']
                env:
                  type: [object, 'null']
                  additionalProperties:
                    type: string
                timeoutMs:
                  type: [integer, 'null']
      responses:
        '200':
          description: Exec state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecResolveResponse'
  /v1/leases/{leaseId}/execs/complete:
    post:
      summary: Complete a durable exec.
      parameters:
        - in: path
          name: leaseId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, key, exitCode, signalCode, artifacts, output]
              properties:
                name:
                  type: string
                key:
                  type: string
                exitCode:
                  type: [integer, 'null']
                signalCode:
                  type: [string, 'null']
                stdoutRef:
                  type: [string, 'null']
                stderrRef:
                  type: [string, 'null']
                artifacts:
                  type: array
                  items:
                    type: object
                    required: [path, ref]
                    properties:
                      path:
                        type: string
                      ref:
                        type: string
                output: {}
      responses:
        '200':
          description: Exec completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecResolveResponse'
  /v1/leases/{leaseId}/execs/fail:
    post:
      summary: Fail a durable exec.
      parameters:
        - in: path
          name: leaseId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, key, artifacts, error]
              properties:
                name:
                  type: string
                key:
                  type: string
                exitCode:
                  type: [integer, 'null']
                signalCode:
                  type: [string, 'null']
                stdoutRef:
                  type: [string, 'null']
                stderrRef:
                  type: [string, 'null']
                artifacts:
                  type: array
                  items:
                    type: object
                    required: [path, ref]
                    properties:
                      path:
                        type: string
                      ref:
                        type: string
                error: {}
                maxAttempts:
                  type: [integer, 'null']
                backoffKind:
                  type: [string, 'null']
                backoffMs:
                  type: [integer, 'null']
                backoffStepMs:
                  type: [integer, 'null']
                backoffFactor:
                  type: [number, 'null']
                maxBackoffMs:
                  type: [integer, 'null']
                backoffJitterKind:
                  type: [string, 'null']
                backoffJitterRatio:
                  type: [number, 'null']
                retryOn:
                  type: [array, 'null']
                  items:
                    type: string
      responses:
        '200':
          description: Exec failed or entered retry wait
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecFailResponse'
  /v1/leases/{leaseId}/waits/sleep:
    post:
      summary: Resolve or suspend on a sleep wait.
      parameters:
        - in: path
          name: leaseId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, durationMs]
              properties:
                key:
                  type: string
                durationMs:
                  type: integer
      responses:
        '200':
          description: Wait state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitResolveResponse'
  /v1/leases/{leaseId}/waits/signal:
    post:
      summary: Resolve or suspend on a signal wait.
      parameters:
        - in: path
          name: leaseId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, name]
              properties:
                key:
                  type: string
                name:
                  type: string
      responses:
        '200':
          description: Wait state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitResolveResponse'
  /v1/leases/{leaseId}/waits/exit:
    post:
      summary: Resolve or suspend on the next durable exit event.
      parameters:
        - in: path
          name: leaseId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key:
                  type: string
      responses:
        '200':
          description: Exit wait state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitResolveResponse'
  /v1/leases/{leaseId}/spawns/resolve:
    post:
      summary: Resolve or create a child workflow run.
      parameters:
        - in: path
          name: leaseId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, key, childRunId, input]
              properties:
                name:
                  type: string
                key:
                  type: string
                childRunId:
                  type: string
                input: {}
      responses:
